name: mommilk_user
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.8+30

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localization: ^0.3.3
  change_app_package_name: ^1.5.0
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  fl_chart: ^1.0.0
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  http: ^1.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  material_charts: ^0.0.39
  linked_scroll_controller: ^0.2.0
  gauge_chart: ^1.0.4
  timelines_plus: ^1.0.7
  date_picker_timeline: ^1.2.7
  font_awesome_flutter: ^10.12.0
  socket_io_client: ^3.1.3
  smooth_page_indicator: ^2.0.1
  carousel_slider: ^5.1.1
  clarity_flutter: ^1.7.0
  package_info_plus: ^9.0.0
  fluttertoast: ^9.0.0
  image_picker: ^1.2.2
  mime: ^2.0.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# ⬇️ THIS SECTION MUST BE BEFORE THE `flutter:` SECTION
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/momsmilk-launcher.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - lib/Assets/AppIcon.png
    - lib/Assets/fullIcon.png
    - assets/momsmilk-launcher.png
    - assets/AppIcon.png
    - lib/Assets/breastFeeding.png
    - lib/Assets/feedingBottle.png
    - assets/
